name: AppSec Sast pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  bandit-incremental-scan:
    name: Bandit Incremental Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get changed py files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: |
            **.py
          include_all_old_new_renames: true
          output_renamed_files_as_deleted_and_added: true

      - name: Run bandit on changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Измененные файлы: ${{ steps.changed-files.outputs.all_changed_files }}"
          pip install bandit
          CHANGED_FILES="${{ steps.changed-files.outputs.all_changed_files }}"
          bandit --severity-level medium --format csv $CHANGED_FILES
      - name: Skip scan
        if: steps.changed-files.outputs.any_changed == 'false'
        run: |
          echo "Файлы не были изменены"
